<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scriptorium - Actionable Lists Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen">
    <div id="app" class="min-h-screen flex flex-col">
        <header class="w-full py-6 px-4 text-center">
            <h1 class="font-['Crimson_Pro'] text-3xl md:text-4xl font-bold text-[#c5a059] tracking-wide italic">Actionable Lists Viewer</h1>
            <button id="theme-toggle" class="theme-toggle-btn" title="Toggle theme: Dark / Light / Sepia" style="margin-left:1rem;vertical-align:middle;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </header>

        <div id="random-quote" class="random-quote hidden"></div>

        <main class="flex-1 w-full max-w-5xl mx-auto px-4 py-8">
            <div id="breadcrumb" class="mb-6 hidden">
                <nav class="flex items-center space-x-2 text-sm font-['Crimson_Pro']">
                    <button id="breadcrumb-home" class="text-[#c5a059] hover:text-[#c5a059]/80 underline transition-colors">Home</button>
                    <span class="text-[#c5a059]/60">&gt;</span>
                    <button id="breadcrumb-source" class="text-[#c5a059] hover:text-[#c5a059]/80 underline transition-colors hidden"></button>
                    <span id="breadcrumb-path-separator" class="text-[#c5a059]/60 hidden">&gt;</span>
                    <span id="breadcrumb-path" class="text-[#c5a059]/60"></span>
                </nav>
            </div>

            <div class="relative">
                <div id="filter-hint" class="filter-hint-wrapper">
                    <svg class="filter-hint-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="-400 0 300 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M -280 95 Q -280 45 -80 45"/>
                        <polyline points="-100,38 -80,45 -100,52"/>
                    </svg>
                    <h3 class="filter-hint-text">Filter Your Favorite<br>Sources of Lists</h3>
                </div>
                <div id="content-container" class="rounded-sm border-4 border-double border-[#c5a059] p-6 md:p-10 min-h-[500px] relative">
                <div id="paper-texture" class="absolute inset-0 pointer-events-none opacity-[0.03] rounded-sm"></div>
                <div id="loading" class="hidden text-center py-20">
                    <div class="inline-block w-8 h-8 border-2 border-[#c5a059] border-t-transparent rounded-full animate-spin"></div>
                    <p class="mt-4 font-['Crimson_Pro'] text-[var(--heading)] italic">Loading...</p>
                </div>
                <div id="error" class="hidden text-center py-20">
                    <p class="font-['Crimson_Pro'] text-[var(--heading)] text-lg"></p>
                    <button id="retry-btn" class="mt-4 px-6 py-2 bg-[#c5a059] text-white font-['Cinzel'] hover:bg-[#c5a059]/80 transition-colors">Retry</button>
                </div>
                <div id="main-content"></div>
                <div id="source-filter-popup" class="popup-overlay hidden">
                    <div class="popup-content">
                        <div class="popup-header">
                            <h3 class="font-['Cinzel'] text-xl text-[var(--heading)]">Filter Sources of Lists</h3>
                            <button id="close-filter-popup" class="popup-close">&times;</button>
                        </div>
                        <div id="source-filter-list" class="source-filter-list">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

        <footer class="w-full py-4 px-4 text-center border-t border-[#c5a059]/30">
            <p class="font-['Crimson_Pro'] text-[#c5a059]/60 text-sm">Scriptorium &copy; 2026 - Developed With Heart and Soul By Edwin Reynoso follower of Jesus Christ</p>

        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
    <script type="text/javascript" src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js" data-name="bmc-button" data-slug="the3dwin" data-color="#FFDD00" data-emoji=""  data-font="Cookie" data-text="Donate" data-outline-color="#000000" data-font-color="#000000" data-coffee-color="#ffffff" ></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((registration) => {
            console.log('ServiceWorker registered:', registration.scope);
          }).catch((error) => {
            console.log('ServiceWorker registration failed:', error);
          });
        });
      }
    </script>
</body>
</html>
